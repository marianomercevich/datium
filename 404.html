<!DOCTYPE html>
<html lang="es-419">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="La página que buscás no está en DatiumTech.">
<title>Página no encontrada | DatiumTech</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#080B14">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<link rel="stylesheet" href="/css/site.css?v=404">
</head>
<body class="err-page">
<nav>
  <a href="/" class="logo" style="display:flex;align-items:center;gap:10px;text-decoration:none">
    <span style="color:var(--tx)">DATIUM<span style="color:var(--cyan)">TECH</span></span>
  </a>
  <div class="nav-links">
    <a href="/servicios/">Servicios</a>
    <a href="/blog/">Blog</a>
    <a href="/#planes">Planes</a>
    <a href="/#contacto">Contacto</a>
  </div>
  <a href="/#contacto" class="nav-cta">Hablar con un asesor</a>
  <button type="button" class="nav-menu" id="nav-toggle" aria-label="Abrir menú" aria-expanded="false"><span></span><span></span><span></span></button>
</nav>

<section class="page-hero">
  <div class="hero-glow"></div>
  <div class="hero-grid"></div>
  <div class="page-hero-inner">
    <p class="err-code">404</p>
    <p class="brand-kicker">PÁGINA NO ENCONTRADA</p>
    <h1 class="page-h1">Ups! No encontramos esta página</h1>
    <p class="page-lead">El enlace está mal escrito, cambió o ya no está en el sitio. Podés volver atrás o ir al inicio.</p>
    <div class="hero-actions">
      <button type="button" class="btn-main" id="go-back">Volver</button>
      <a class="btn-ghost" href="/">Ir al inicio</a>
    </div>
  </div>
</section>

<footer>
  <div class="footer-inner">
    <div class="footer-logo">DATIUM<span>TECH</span></div>
    <div class="footer-copy">© 2026 DatiumTech</div>
    <div class="footer-links">
      <a href="/">Inicio</a>
      <a href="/servicios/">Servicios</a>
      <a href="/blog/">Blog</a>
      <a href="/privacidad.html">Privacidad</a>
    </div>
  </div>
</footer>
<script>
const navToggle=document.getElementById('nav-toggle');
const navLinks=document.querySelector('.nav-links');
if(navToggle&&navLinks){navToggle.addEventListener('click',()=>{const open=navLinks.classList.toggle('open');navToggle.setAttribute('aria-expanded',open?'true':'false');});}
document.getElementById('go-back').addEventListener('click',function(){
  var ref='';
  try{ref=document.referrer?new URL(document.referrer).origin:'';}catch(e){ref='';}
  if(ref===location.origin){history.back();return;}
  location.href='/';
});
</script>
</body>
</html>
